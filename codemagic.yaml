workflows:
  tianji-web-export:
    name: TianJi web export smoke
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
    scripts:
    - name: Install dependencies
      script: npm install --legacy-peer-deps
    - name: Install web deps
      script: npx --yes expo install react-dom react-native-web
    - name: Expo export (web)
      script: npx --yes expo export --platform web --output-dir web-build
    artifacts:
    - web-build/**/*
  tianji-ios-release:
    name: TianJi Android (prebuild smoke)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
    scripts:
    - name: Install dependencies
      script: npm install --legacy-peer-deps
    - name: Expo prebuild
      script: npx --yes expo prebuild -p android --no-install
    - name: Gradle assemble (debug)
      script: cd android && ./gradlew assembleDebug
    artifacts:
    - android/app/build/outputs/**/*.apk
