workflows:
  tianji-web-export:
    name: TianJi web export smoke
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
    scripts:
    - name: Install dependencies
      script: npm install --legacy-peer-deps
    - name: Install web deps
      script: npx --yes expo install react-dom react-native-web
    - name: Expo export (web)
      script: npx --yes expo export --platform web --output-dir web-build
    artifacts:
    - web-build/**/*
  tianji-ios-release:
    name: TianJi iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      vars:
        CM_CERTIFICATE_B64: 
        CM_CERTIFICATE_PW: Aurenix2026!
        CM_PROFILE_B64: 
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Install signing files (manual)
        script: |
          set -e
          echo "$CM_CERTIFICATE_B64" | base64 --decode > /tmp/certificate.p12
          echo "$CM_PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "$CM_CERTIFICATE_PW" sign.keychain
          security import /tmp/certificate.p12 -k sign.keychain -P "$CM_CERTIFICATE_PW" -A
          security unlock-keychain -p "$CM_CERTIFICATE_PW" sign.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CM_CERTIFICATE_PW" sign.keychain
          security list-keychains -s sign.keychain
          security default-keychain -d user -s sign.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Apply manual signing to Xcode project
        script: xcode-project use-profiles
      - name: Build ipa
        script: xcode-project build-ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: |
