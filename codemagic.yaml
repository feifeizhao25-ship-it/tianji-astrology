workflows:
  tianji-web-export:
    name: TianJi web export smoke
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
    scripts:
    - name: Install dependencies
      script: npm install --legacy-peer-deps
    - name: Install web deps
      script: npx --yes expo install react-dom react-native-web
    - name: Expo export (web)
      script: npx --yes expo export --platform web --output-dir web-build
    artifacts:
    - web-build/**/*
  tianji-ios-release:
    name: TianJi iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tianji.jianji
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: /usr/local/bin/xcode-project use-profiles
      - name: Build ipa
        script: xcode-project build-ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
