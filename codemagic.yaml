# Codemagic workflow for TianJi (Expo/React Native)
workflows:
  tianji-web-export:
    name: TianJi web export smoke
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Install web deps
        script: npx --yes expo install react-dom react-native-web
      - name: Expo export (web)
        script: npx --yes expo export --platform web --output-dir web-build
    artifacts:
      - web-build/**/*
  tianji-ios-release:
    name: TianJi iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tianji.jianji
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Expo prebuild (iOS)
        script: npx --yes expo prebuild -p ios --no-install
      - name: Pod install
        script: cd ios && pod install
      - name: Build IPA (signed, app_store)
        script: |-
          if [ -d ios/app.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/app.xcworkspace --scheme app
          else
            xcode-project build-ipa --project ios/app.xcodeproj --scheme app
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

    name: TianJi Android (prebuild smoke)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Expo prebuild
        script: npx --yes expo prebuild -p android --no-install
      - name: Gradle assemble (debug)
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
  tianji-android:
    name: TianJi Android (prebuild smoke)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Expo prebuild
        script: npx --yes expo prebuild -p android --no-install
      - name: Gradle assemble (debug)
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
