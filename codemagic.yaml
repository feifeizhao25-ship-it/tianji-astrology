# Codemagic workflow for TianJi (Expo/React Native)
workflows:
  tianji-web-export:
    name: TianJi web export smoke
    instance_type: linux
    max_build_duration: 30
    environment:
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Expo export (web)
        script: npx --yes expo export --platform web --output-dir web-build
    artifacts:
      - web-build/**/*
  tianji-android:
    name: TianJi Android (prebuild smoke)
    instance_type: linux
    max_build_duration: 60
    environment:
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Expo prebuild
        script: npx --yes expo prebuild -p android --no-install
      - name: Gradle assemble (debug)
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
