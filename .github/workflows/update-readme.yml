name: Update README with latest blog posts
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python .github/scripts/sync_readme.py
        env:
          SITEMAP_URL: "https://tianji-astrology.com/sitemap.xml"
      - run: |
          git config user.name "blog-sync-bot"
          git config user.email "actions@github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: sync latest blog posts" && git push
